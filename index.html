<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TRAPO — Asistencia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#14BBE2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TRAPO">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan:      #14BBE2;
      --cyan-dark: #0071A8;
      --cyan-light:#E6F8FD;
      --cyan-mid:  #B3E8F5;
      --black:     #0A0A0A;
      --gray:      #6B7280;
      --border:    #E5E7EB;
      --bg:        #F0F8FB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 32px rgba(20,187,226,0.10);
    }

    /* ---- LOGO ---- */
    .logo {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .logo svg { width: 200px; height: auto; }
    .logo .tagline { font-size: 12px; color: var(--gray); margin-top: 10px; letter-spacing: 0.5px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      margin-bottom: 6px;
      margin-top: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
      background: #FAFCFD;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--cyan); background: white; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.3px;
    }
    .btn:active   { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--cyan); color: white; }
    .btn-entrada { background: #16a34a; color: white; }
    .btn-salida  { background: #dc2626; color: white; }
    .btn-logout  { background: none; color: var(--gray); border: 1.5px solid var(--border); font-size: 13px; padding: 10px; }
    .btn-cambiar { background: none; color: var(--cyan-dark); border: 1.5px solid var(--cyan-mid); font-size: 13px; padding: 10px; font-weight: 700; margin-top: 10px; }

    .error   { color: #dc2626; font-size: 13px; margin-top: 10px; text-align: center; font-weight: 600; }
    .success { color: #16a34a; font-size: 13px; margin-top: 10px; text-align: center; font-weight: 600; }

    /* ---- HEADER EMPLEADO ---- */
    .user-header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .user-header .mini-logo { margin-bottom: 10px; }
    .user-header .mini-logo svg { width: 90px; height: auto; }
    .user-header .nombre { font-size: 17px; font-weight: 800; color: var(--black); }
    .user-header .hora   { font-size: 34px; font-weight: 900; color: var(--cyan); margin: 6px 0 2px; letter-spacing: 1px; }
    .user-header .fecha  { font-size: 12px; color: var(--gray); font-weight: 600; text-transform: capitalize; }

    .loc-status { font-size: 12px; color: var(--gray); text-align: center; margin-top: 8px; font-weight: 600; }
    .loc-status.ok    { color: #16a34a; }
    .loc-status.error { color: #dc2626; }

    /* ---- SECCIÓN TÍTULO ---- */
    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--cyan-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* ---- TARJETAS DE SERVICIO ---- */
    .service-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--cyan);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-align: left;
      width: 100%;
      background: white;
    }
    .service-card:active { background: var(--cyan-light); transform: scale(0.99); }
    .service-card .s-nombre { font-size: 14px; font-weight: 700; color: var(--black); }
    .service-card .s-dir    { font-size: 11px; color: var(--gray); margin-top: 3px; font-weight: 500; }
    .service-card .s-arrow  { font-size: 20px; color: var(--cyan); margin-left: 10px; flex-shrink: 0; font-weight: 700; }

    /* ---- SERVICIO SELECCIONADO ---- */
    .selected-banner {
      background: var(--cyan-light);
      border: 1.5px solid var(--cyan-mid);
      border-left: 4px solid var(--cyan);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .selected-banner .sb-label  { font-size: 10px; font-weight: 800; color: var(--cyan-dark); text-transform: uppercase; letter-spacing: 1px; }
    .selected-banner .sb-nombre { font-size: 16px; font-weight: 800; color: var(--black); margin-top: 3px; }
    .selected-banner .sb-dir    { font-size: 11px; color: var(--gray); margin-top: 2px; font-weight: 500; }

    /* ---- BADGES ---- */
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-entrada { background: #dcfce7; color: #16a34a; }
    .badge-salida  { background: #fee2e2; color: #dc2626; }

    /* ---- TABS ---- */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--gray);
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.3px;
    }
    .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }

    /* ---- HISTORIAL ---- */
    .hist-day { margin-bottom: 18px; }
    .hist-day-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--cyan-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .hist-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      gap: 8px;
    }
    .hist-row.entrada { background: #f0fdf4; }
    .hist-row.salida  { background: #fef2f2; }
    .hist-row .hr-serv { font-size: 13px; font-weight: 700; color: var(--black); }
    .hist-row .hr-hora { font-size: 11px; color: var(--gray); margin-top: 2px; font-weight: 600; }
    .hist-row .hr-right { text-align: right; flex-shrink: 0; }
    .hist-empty   { text-align: center; color: var(--gray); font-size: 13px; padding: 30px 0; font-weight: 600; }
    .hist-loading { text-align: center; color: var(--cyan); font-size: 13px; padding: 30px 0; font-weight: 600; }
    .btn-refresh {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--cyan-mid);
      border-radius: 10px;
      background: var(--cyan-light);
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--cyan-dark);
      cursor: pointer;
      margin-bottom: 16px;
    }

    /* ---- MATERIALES ---- */
    .mat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      background: white;
      gap: 10px;
    }
    .mat-item.pedido { background: #fffbeb; border-color: #fde68a; }
    .mat-nombre { font-size: 13px; font-weight: 700; color: var(--black); }
    .mat-fecha  { font-size: 11px; color: var(--gray); margin-top: 2px; font-weight: 600; }
    .btn-mini {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-pedir    { background: var(--cyan-light); color: var(--cyan-dark); border: 1.5px solid var(--cyan-mid); }
    .btn-recibido { background: #dcfce7; color: #16a34a; border: 1.5px solid #bbf7d0; }

    /* ---- SCREENS ---- */
    #screen-login  { display: block; }
    #screen-home   { display: none; }
    #section-servicios { display: block; }
    #section-registro  { display: none; }
    #tab-registrar  { display: block; }
    #tab-historial  { display: none; }
    #tab-materiales { display: none; }
    #mat-sin-servicio { display: block; }
    #mat-con-servicio { display: none; }
  </style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="screen-login" class="card">
  <div class="logo">
    <img src="Blue With Sparkles Cleaning Service Logo .png" alt="TRAPO" style="width:220px; height:auto;">
    <p class="tagline">Sistema de Asistencia · Fiorentino Blaiotta</p>
  </div>

  <label for="inp-nombre">Empleado</label>
  <select id="inp-nombre">
    <option value="">-- Seleccioná tu nombre --</option>
    <option value="Maria Decimas">Maria Decimas</option>
    <option value="Celeste Freire">Celeste Freire</option>
    <option value="Rocio Medina">Rocio Medina</option>
    <option value="Brisa Medina">Brisa Medina</option>
    <option value="Sabrina Scarampo">Sabrina Scarampo</option>
    <option value="Sabrina Yanel Dichito">Sabrina Yanel Dichito</option>
    <option value="Alejandro Jelvez">Alejandro Jelvez</option>
    <option value="Rebeca Ayala">Rebeca Ayala</option>
  </select>

  <label for="inp-pass">Contraseña</label>
  <input type="password" id="inp-pass" placeholder="••••••">

  <button class="btn btn-primary" onclick="login()">Ingresar</button>
  <div id="login-error" class="error"></div>
</div>

<!-- ==================== HOME ==================== -->
<div id="screen-home" class="card">

  <!-- Header con nombre y reloj -->
  <div class="user-header">
    <div class="mini-logo">
      <img src="Blue With Sparkles Cleaning Service Logo .png" alt="TRAPO" style="width:100px; height:auto;">
    </div>
    <div class="nombre" id="display-nombre"></div>
    <div class="hora"   id="display-hora">--:--</div>
    <div class="fecha"  id="display-fecha"></div>
    <div class="loc-status" id="loc-status">Obteniendo ubicación...</div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tbtn-registrar"  onclick="switchTab('registrar')">📝 Registrar</button>
    <button class="tab-btn"        id="tbtn-materiales" onclick="switchTab('materiales')">📦 Materiales</button>
    <button class="tab-btn"        id="tbtn-historial"  onclick="switchTab('historial')">📋 Historial</button>
  </div>

  <!-- TAB: REGISTRAR -->
  <div id="tab-registrar">
    <!-- PASO 1: Selección de servicio -->
    <div id="section-servicios">
      <div class="section-title">¿En qué servicio estás?</div>
      <div id="service-list"></div>
    </div>

    <!-- PASO 2: Registro entrada / salida -->
    <div id="section-registro">
      <div class="selected-banner">
        <div class="sb-label">Servicio seleccionado</div>
        <div class="sb-nombre" id="sb-nombre"></div>
        <div class="sb-dir"    id="sb-dir"></div>
      </div>
      <!-- Solo para "Horas Extras": el empleado escribe la dirección -->
      <div id="he-dir-wrap" style="display:none;">
        <label for="he-dir">Dirección donde hacés las horas extra</label>
        <input type="text" id="he-dir" placeholder="Ej: Av. Rivadavia 1234, Morón" oninput="onHeDirInput()" autocomplete="off">
      </div>
      <button class="btn btn-entrada" id="btn-entrada" onclick="registrar('Entrada')">✅ Registrar ENTRADA</button>
      <button class="btn btn-salida"  id="btn-salida"  onclick="registrar('Salida')">🚪 Registrar SALIDA</button>
      <button class="btn btn-cambiar" onclick="cambiarServicio()">↩ Cambiar servicio</button>
    </div>

    <div id="home-msg" class="success" style="margin-top:14px;"></div>
  </div>

  <!-- TAB: MATERIALES -->
  <div id="tab-materiales">
    <div id="mat-sin-servicio">
      <div class="section-title">¿Para qué servicio pedís materiales?</div>
      <div id="mat-service-list"></div>
    </div>
    <div id="mat-con-servicio">
      <div class="selected-banner">
        <div class="sb-label">Pedidos para</div>
        <div class="sb-nombre" id="mat-sb-nombre"></div>
      </div>
      <button class="btn btn-cambiar" onclick="cambiarServicioMateriales()">↩ Cambiar servicio</button>
      <div class="section-title" style="margin-top:18px;">Productos</div>
      <div id="mat-list"><div class="hist-loading">⏳ Cargando productos...</div></div>
      <div class="section-title" style="margin-top:18px;">Historial de pedidos</div>
      <div id="mat-hist"><div class="hist-empty">Sin pedidos todavía.</div></div>
    </div>
  </div>

  <!-- TAB: HISTORIAL -->
  <div id="tab-historial">
    <button class="btn-refresh" onclick="cargarHistorial()">🔄 Actualizar historial</button>
    <div id="hist-content"><div class="hist-empty">Tocá "Actualizar historial" para ver tus registros.</div></div>
  </div>

  <button class="btn btn-logout" onclick="logout()" style="margin-top:20px;">Cerrar sesión</button>
</div>

<script>
  // ============================================================
  // ✏️  PEGÁ TU URL DEL APPS SCRIPT AQUÍ:
  // ============================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBxzMn_rTW6DwmdaQWdSra4edDIc9vPOS9zYNgIchgJ5MT5M1HB8IQresJu4_3hukG/exec";

  // ============================================================
  // SERVICIOS por empleado
  // ============================================================
  const SERVICIOS = {
    "Maria Decimas": [
      { nombre: "Monteverde",  dir: "Monteverde 584, Castelar, Buenos Aires" },
      { nombre: "Bayardi",     dir: "Bayardi 2519, Castelar, Buenos Aires" },
      { nombre: "Elflein",     dir: "Elflein 2549, Castelar, Buenos Aires" },
      { nombre: "Drago",       dir: "Drago 2561, Castelar, Buenos Aires" },
      { nombre: "Azopardo",    dir: "Azopardo 1854, Castelar, Buenos Aires" }
    ],
    "Celeste Freire": [
      { nombre: "Acorus", dir: "Av. Pres. Perón 10203, Villa Udaondo, Buenos Aires" }
    ],
    "Rocio Medina": [
      { nombre: "Acorus", dir: "Av. Pres. Perón 10203, Villa Udaondo, Buenos Aires" }
    ],
    "Brisa Medina": [
      { nombre: "Consultorios Médicos", dir: "Peatonal Eva Perón 827, Ituzaingó, Buenos Aires" }
    ],
    "Sabrina Scarampo": [
      { nombre: "Santa Rosa",   dir: "Santa Rosa 1592, Ituzaingó, Buenos Aires" },
      { nombre: "Jonte",        dir: "Jonte 330, Ramos Mejía, Buenos Aires" },
      { nombre: "Suipacha",     dir: "Suipacha 209, Haedo, Buenos Aires" },
      { nombre: "Garcia Silva", dir: "Garcia Silva 361, Morón, Buenos Aires" }
    ],
    "Sabrina Yanel Dichito": [
      { nombre: "Consultorios Médicos", dir: "Peatonal Eva Perón 827, Ituzaingó, Buenos Aires" }
    ],
    "Alejandro Jelvez": [
      { nombre: "Del Himno",          dir: "Del Himno 124, Haedo, Buenos Aires" },
      { nombre: "Rivadavia",          dir: "Rivadavia 16450, Haedo, Buenos Aires" },
      { nombre: "República de Chile", dir: "República de Chile 1711, Villa Luzuriaga, Buenos Aires" }
    ],
    "Rebeca Ayala": [
      { nombre: "Mitre",          dir: "Mitre 2346, Castelar, Buenos Aires" },
      { nombre: "San Martín",     dir: "San Martín 88, Morón, Buenos Aires" },
      { nombre: "Mercedes",       dir: "Mercedes 1090, Castelar, Buenos Aires" },
      { nombre: "Mariano Moreno", dir: "Mariano Moreno 215, Ramos Mejía, Buenos Aires" },
      { nombre: "Avellaneda",     dir: "Nicolás Avellaneda 930, Castelar, Buenos Aires" }
    ]
  };

  // "Horas Extras" es un servicio extra que tienen TODOS los empleados,
  // por encima de los suyos. No tiene dirección fija: el empleado la
  // escribe al fichar (marca `custom: true`). Se suma por código para no
  // repetirlo en cada empleado de SERVICIOS.
  const HORAS_EXTRAS = { nombre: "Horas Extras", custom: true };

  // Servicios que se muestran en la pestaña Registrar para el empleado
  // actual: los suyos + "Horas Extras" al final.
  function serviciosRegistro() {
    return [...(SERVICIOS[currentUser] || []), HORAS_EXTRAS];
  }
  // ============================================================

  let currentUser    = null;
  let currentHash    = null;
  let currentCoords  = null;
  let selectedService = null;
  let clockInterval  = null;

  // Clave bajo la que se persiste la sesión para que no se cierre
  // al cerrar la app o al volver atrás.
  const SESSION_KEY = "trapo_session";

  // ---------- HASH (la contraseña nunca viaja en texto plano) ----------
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // ---------- SESIÓN PERSISTENTE ----------
  // La sesión vence todos los días a las 23:59. Devuelve el timestamp de
  // la próxima 23:59 a partir de ahora (si ya pasó hoy, es la de mañana).
  function proximoVencimiento() {
    const v = new Date();
    v.setHours(23, 59, 0, 0);
    if (v.getTime() <= Date.now()) v.setDate(v.getDate() + 1);
    return v.getTime();
  }
  function saveSession(nombre, hash) {
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        empleado: nombre, hash, expira: proximoVencimiento()
      }));
    }
    catch (e) { /* almacenamiento no disponible: la sesión durará solo lo que dure la pestaña */ }
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      // Vencida (ya pasó la 23:59 del día): descartar.
      if (!s || !s.expira || Date.now() >= s.expira) { clearSession(); return null; }
      // Validar que el empleado siga existiendo en la config actual.
      if (s.empleado && s.hash && SERVICIOS[s.empleado]) return s;
    } catch (e) {}
    return null;
  }

  // Entra a la pantalla principal. Compartido entre login manual y
  // restauración de sesión guardada.
  function enterApp(nombre, hash) {
    currentUser = nombre;
    currentHash = hash;
    document.getElementById("inp-pass").value = "";
    document.getElementById("display-nombre").textContent = nombre;
    document.getElementById("screen-login").style.display = "none";
    document.getElementById("screen-home").style.display  = "block";

    startClock();
    getLocation();
    renderServices();
  }

  // Al abrir la app, restaurar sesión si hay una guardada.
  function restoreSession() {
    const s = loadSession();
    if (s) enterApp(s.empleado, s.hash);
  }

  // ---------- LOGIN ----------
  async function login() {
    const nombre  = document.getElementById("inp-nombre").value.trim();
    const pass    = document.getElementById("inp-pass").value.trim();
    const errEl   = document.getElementById("login-error");
    const btnLogin = document.querySelector("#screen-login .btn-primary");
    errEl.textContent = "";

    if (!nombre) { errEl.textContent = "Seleccioná tu nombre."; return; }
    if (!pass)   { errEl.textContent = "Ingresá tu contraseña."; return; }

    btnLogin.disabled = true;
    try {
      const hash = await sha256Hex(pass);
      const url  = APPS_SCRIPT_URL + "?" + new URLSearchParams({ action: "login", empleado: nombre, hash }).toString();
      const res  = await fetch(url, { redirect: "follow" });
      const json = await res.json();

      if (json.status !== "ok") {
        errEl.textContent = json.message || "Usuario o contraseña incorrectos.";
        return;
      }

      saveSession(nombre, hash);
      enterApp(nombre, hash);
    } catch (e) {
      errEl.textContent = "❌ No se pudo verificar: " + e.message;
    } finally {
      btnLogin.disabled = false;
    }
  }

  // ---------- LOGOUT ----------
  function logout() {
    clearSession();
    clearInterval(clockInterval);
    currentUser = currentHash = currentCoords = selectedService = null;
    document.getElementById("screen-home").style.display  = "none";
    document.getElementById("screen-login").style.display = "block";
    document.getElementById("inp-nombre").value = "";
    document.getElementById("home-msg").textContent = "";
    document.getElementById("hist-content").innerHTML = `<div class="hist-empty">Tocá "Actualizar historial" para ver tus registros.</div>`;
    document.getElementById("section-servicios").style.display = "block";
    document.getElementById("section-registro").style.display  = "none";
    document.getElementById("mat-list").innerHTML = "";
    document.getElementById("mat-hist").innerHTML = `<div class="hist-empty">Sin pedidos todavía.</div>`;
    document.getElementById("mat-sin-servicio").style.display = "block";
    document.getElementById("mat-con-servicio").style.display = "none";
    switchTab("registrar");
  }

  // ---------- RELOJ ----------
  function startClock() {
    function tick() {
      const now = new Date();
      document.getElementById("display-hora").textContent =
        now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      document.getElementById("display-fecha").textContent =
        now.toLocaleDateString("es-AR", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }
    tick();
    clockInterval = setInterval(tick, 1000);
  }

  // ---------- UBICACIÓN ----------
  function getLocation() {
    const el = document.getElementById("loc-status");
    if (!navigator.geolocation) {
      el.textContent = "⚠️ GPS no disponible.";
      el.className = "loc-status error";
      return;
    }
    el.textContent = "📍 Obteniendo ubicación...";
    el.className = "loc-status";
    navigator.geolocation.watchPosition(
      pos => {
        currentCoords = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          acc: Math.round(pos.coords.accuracy)
        };
        el.textContent = `📍 Ubicación OK (±${currentCoords.acc}m)`;
        el.className = "loc-status ok";
      },
      () => {
        el.textContent = "⚠️ No se pudo obtener ubicación.";
        el.className = "loc-status error";
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  // ---------- RENDERIZAR SERVICIOS ----------
  function renderServices() {
    const servicios = serviciosRegistro();
    const list = document.getElementById("service-list");

    list.innerHTML = servicios.map((s, i) => `
      <button class="service-card" onclick="selectService(${i})">
        <div>
          <div class="s-nombre">${s.nombre}</div>
          <div class="s-dir">${s.custom ? "✍️ Escribís la dirección al fichar" : s.dir}</div>
        </div>
        <span class="s-arrow">›</span>
      </button>
    `).join("");
  }

  // ---------- SELECCIONAR SERVICIO ----------
  function selectService(index) {
    const servicios = serviciosRegistro();
    selectedService = servicios[index];
    document.getElementById("sb-nombre").textContent = selectedService.nombre;

    const dirEl   = document.getElementById("sb-dir");
    const heWrap  = document.getElementById("he-dir-wrap");
    const heInput = document.getElementById("he-dir");
    const btnE    = document.getElementById("btn-entrada");
    const btnS    = document.getElementById("btn-salida");

    if (selectedService.custom) {
      // Horas Extras: ocultar dir fija, mostrar campo de dirección y
      // bloquear Entrada/Salida hasta que escriban algo.
      dirEl.style.display = "none";
      heWrap.style.display = "block";
      heInput.value = "";
      btnE.disabled = btnS.disabled = true;
    } else {
      dirEl.style.display = "block";
      dirEl.textContent   = selectedService.dir;
      heWrap.style.display = "none";
      btnE.disabled = btnS.disabled = false;
    }

    document.getElementById("section-servicios").style.display = "none";
    document.getElementById("section-registro").style.display  = "block";
    document.getElementById("home-msg").textContent = "";
  }

  // Habilita Entrada/Salida solo cuando hay una dirección escrita (Horas Extras).
  function onHeDirInput() {
    const vacio = document.getElementById("he-dir").value.trim().length === 0;
    document.getElementById("btn-entrada").disabled = vacio;
    document.getElementById("btn-salida").disabled  = vacio;
  }

  // ---------- CAMBIAR SERVICIO ----------
  function cambiarServicio() {
    selectedService = null;
    document.getElementById("section-registro").style.display  = "none";
    document.getElementById("section-servicios").style.display = "block";
    document.getElementById("home-msg").textContent = "";
  }

  // ---------- REGISTRAR ----------
  async function registrar(tipo) {
    const msgEl = document.getElementById("home-msg");
    const btnE  = document.getElementById("btn-entrada");
    const btnS  = document.getElementById("btn-salida");

    // Horas Extras: la dirección la escribe el empleado; el resto la trae el servicio.
    const direccion = selectedService.custom
      ? document.getElementById("he-dir").value.trim()
      : selectedService.dir;

    if (selectedService.custom && !direccion) {
      msgEl.className = "error";
      msgEl.textContent = "Ingresá la dirección de las horas extra.";
      return;
    }

    msgEl.className = "success";
    msgEl.textContent = "Guardando...";
    btnE.disabled = btnS.disabled = true;

    const now = new Date();
    const record = {
      empleado:  currentUser,
      hash:      currentHash,
      servicio:  selectedService.nombre,
      direccion: direccion,
      tipo:      tipo,
      fecha:     now.toLocaleDateString("es-AR"),
      hora:      now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      lat:       currentCoords ? currentCoords.lat : "",
      lon:       currentCoords ? currentCoords.lon : "",
      precision: currentCoords ? currentCoords.acc : ""
    };

    try {
      const params = new URLSearchParams(record);
      const res  = await fetch(APPS_SCRIPT_URL + "?" + params.toString(), { redirect: "follow" });
      const json = await res.json();

      if (json.status !== "ok") {
        msgEl.className = "error";
        msgEl.textContent = "❌ " + (json.message || "No se pudo guardar el registro.");
      } else {
        msgEl.textContent = `✅ ${tipo} registrada en ${record.servicio} a las ${record.hora}`;
      }
    } catch (e) {
      msgEl.className = "error";
      msgEl.textContent = "❌ Error al guardar: " + e.message;
    }

    btnE.disabled = btnS.disabled = false;
  }

  // ---------- TABS ----------
  function switchTab(tab) {
    document.getElementById("tab-registrar").style.display  = tab === "registrar"  ? "block" : "none";
    document.getElementById("tab-materiales").style.display = tab === "materiales" ? "block" : "none";
    document.getElementById("tab-historial").style.display  = tab === "historial"  ? "block" : "none";
    document.getElementById("tbtn-registrar").classList.toggle("active", tab === "registrar");
    document.getElementById("tbtn-materiales").classList.toggle("active", tab === "materiales");
    document.getElementById("tbtn-historial").classList.toggle("active", tab === "historial");
    if (tab === "historial")  cargarHistorial();
    if (tab === "materiales") renderMaterialesTab();
  }

  // ---------- CARGAR HISTORIAL DESDE SHEETS ----------
  async function cargarHistorial() {
    const el = document.getElementById("hist-content");
    el.innerHTML = `<div class="hist-loading">⏳ Cargando registros...</div>`;

    try {
      const url = APPS_SCRIPT_URL + "?" + new URLSearchParams({ action: "historial", empleado: currentUser, hash: currentHash }).toString();
      const res  = await fetch(url, { redirect: "follow" });
      const json = await res.json();

      if (json.status !== "ok") {
        el.innerHTML = `<div class="hist-empty" style="color:#ef4444;">❌ ${json.message || "No se pudo cargar el historial."}</div>`;
        return;
      }

      if (!json.records || json.records.length === 0) {
        el.innerHTML = `<div class="hist-empty">No hay registros todavía.</div>`;
        return;
      }

      // Agrupar por fecha
      const grupos = {};
      json.records.forEach(r => {
        if (!grupos[r.fecha]) grupos[r.fecha] = [];
        grupos[r.fecha].push(r);
      });

      el.innerHTML = Object.entries(grupos).map(([fecha, registros]) => `
        <div class="hist-day">
          <div class="hist-day-label">${fecha}</div>
          ${registros.map(r => `
            <div class="hist-row ${r.tipo.toLowerCase()}">
              <div>
                <div class="hr-serv">${r.servicio}</div>
                <div class="hr-hora">${r.hora}</div>
              </div>
              <div class="hr-right">
                <span class="badge badge-${r.tipo.toLowerCase()}">${r.tipo}</span>
                ${r.linkGPS && r.linkGPS !== 'No disponible'
                  ? `<br><a href="${r.linkGPS}" target="_blank" style="font-size:11px;color:#4f46e5;">📍 Ver mapa</a>`
                  : ''}
              </div>
            </div>
          `).join("")}
        </div>
      `).join("");

    } catch (e) {
      el.innerHTML = `<div class="hist-empty" style="color:#ef4444;">❌ Error al cargar: ${e.message}</div>`;
    }
  }

  // ---------- MATERIALES ----------
  let currentMateriales = [];

  function renderMaterialesTab() {
    const sinServ = document.getElementById("mat-sin-servicio");
    const conServ = document.getElementById("mat-con-servicio");

    // "Horas Extras" no pide materiales: obligar a elegir un servicio real.
    if (!selectedService || selectedService.custom) {
      sinServ.style.display = "block";
      conServ.style.display = "none";
      const servicios = SERVICIOS[currentUser] || [];
      document.getElementById("mat-service-list").innerHTML = servicios.map((s, i) => `
        <button class="service-card" onclick="selectServiceMateriales(${i})">
          <div>
            <div class="s-nombre">${s.nombre}</div>
            <div class="s-dir">${s.dir}</div>
          </div>
          <span class="s-arrow">›</span>
        </button>
      `).join("");
      return;
    }

    sinServ.style.display = "none";
    conServ.style.display = "block";
    document.getElementById("mat-sb-nombre").textContent = selectedService.nombre;
    cargarMateriales();
    cargarHistorialPedidos();
  }

  function selectServiceMateriales(index) {
    const servicios = SERVICIOS[currentUser] || [];
    selectedService = servicios[index];
    renderMaterialesTab();
  }

  function cambiarServicioMateriales() {
    selectedService = null;
    renderMaterialesTab();
  }

  async function cargarMateriales() {
    const el = document.getElementById("mat-list");
    el.innerHTML = `<div class="hist-loading">⏳ Cargando productos...</div>`;

    try {
      const url = APPS_SCRIPT_URL + "?" + new URLSearchParams({
        action: "materiales", servicio: selectedService.nombre, empleado: currentUser, hash: currentHash
      }).toString();
      const res  = await fetch(url, { redirect: "follow" });
      const json = await res.json();

      if (json.status !== "ok") {
        el.innerHTML = `<div class="hist-empty" style="color:#ef4444;">❌ ${json.message || "No se pudo cargar."}</div>`;
        return;
      }

      currentMateriales = json.productos;
      el.innerHTML = currentMateriales.map((p, i) => `
        <div class="mat-item ${p.estado === 'pedido' ? 'pedido' : ''}">
          <div>
            <div class="mat-nombre">${p.nombre}</div>
            ${p.estado === 'pedido' ? `<div class="mat-fecha">⏳ Pedido el ${p.fecha}</div>` : ''}
          </div>
          ${p.estado === 'pedido'
            ? `<button class="btn-mini btn-recibido" onclick="marcarRecibido(${i})">✅ Recibido</button>`
            : `<button class="btn-mini btn-pedir" onclick="pedirProducto(${i})">➕ Pedir</button>`}
        </div>
      `).join("");

    } catch (e) {
      el.innerHTML = `<div class="hist-empty" style="color:#ef4444;">❌ Error al cargar: ${e.message}</div>`;
    }
  }

  async function pedirProducto(index) {
    const producto = currentMateriales[index].nombre;
    try {
      const url = APPS_SCRIPT_URL + "?" + new URLSearchParams({
        action: "pedir", servicio: selectedService.nombre, producto, empleado: currentUser, hash: currentHash
      }).toString();
      const res  = await fetch(url, { redirect: "follow" });
      const json = await res.json();
      if (json.status !== "ok") { alert(json.message || "No se pudo pedir el producto."); return; }
      cargarMateriales();
      cargarHistorialPedidos();
    } catch (e) {
      alert("❌ Error: " + e.message);
    }
  }

  async function marcarRecibido(index) {
    const producto = currentMateriales[index].nombre;
    try {
      const url = APPS_SCRIPT_URL + "?" + new URLSearchParams({
        action: "recibido", servicio: selectedService.nombre, producto, empleado: currentUser, hash: currentHash
      }).toString();
      const res  = await fetch(url, { redirect: "follow" });
      const json = await res.json();
      if (json.status !== "ok") { alert(json.message || "No se pudo marcar como recibido."); return; }
      cargarMateriales();
      cargarHistorialPedidos();
    } catch (e) {
      alert("❌ Error: " + e.message);
    }
  }

  async function cargarHistorialPedidos() {
    const el = document.getElementById("mat-hist");
    el.innerHTML = `<div class="hist-loading">⏳ Cargando...</div>`;

    try {
      const url = APPS_SCRIPT_URL + "?" + new URLSearchParams({
        action: "historialPedidos", servicio: selectedService.nombre, empleado: currentUser, hash: currentHash
      }).toString();
      const res  = await fetch(url, { redirect: "follow" });
      const json = await res.json();

      if (json.status !== "ok") {
        el.innerHTML = `<div class="hist-empty" style="color:#ef4444;">❌ ${json.message || "No se pudo cargar."}</div>`;
        return;
      }

      if (!json.records || json.records.length === 0) {
        el.innerHTML = `<div class="hist-empty">Sin pedidos todavía.</div>`;
        return;
      }

      el.innerHTML = json.records.map(r => `
        <div class="hist-row ${r.accion === 'Pedido' ? 'salida' : 'entrada'}">
          <div>
            <div class="hr-serv">${r.producto}</div>
            <div class="hr-hora">${r.fecha} ${r.hora} · ${r.empleado}</div>
          </div>
          <span class="badge badge-${r.accion === 'Pedido' ? 'salida' : 'entrada'}">${r.accion}</span>
        </div>
      `).join("");

    } catch (e) {
      el.innerHTML = `<div class="hist-empty" style="color:#ef4444;">❌ Error al cargar: ${e.message}</div>`;
    }
  }

  // ---------- ARRANQUE ----------
  // Si hay sesión guardada, entrar directo sin pedir login de nuevo.
  restoreSession();
</script>
</body>
</html>
